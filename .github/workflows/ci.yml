name: Student System CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Java files
        run: javac *.java

      - name: Run main program test
        run: java Main

      - name: Run system test
        run: java StudentManagerTest

      - name: Basic code quality check
        run: |
          echo "Checking for risky code patterns..."
          grep -R "System.exit" . || true
          grep -R "printStackTrace" . || true
